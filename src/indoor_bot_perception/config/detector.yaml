detector_node:
  ros__parameters:
    model_path: yolo11n.pt
    device: cpu
    conf_threshold: 0.5
    iou_threshold: 0.45
    input_size: 320
    target_classes: ['chair', 'potted plant', 'dining table', 'couch', 'backpack', 'suitcase', 'sports ball', 'bottle', 'person']
    publish_annotated: true
    annotated_period_s: 0.5
